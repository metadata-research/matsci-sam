map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream matsci_sam_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Keep both names valid at the proxy. NEXT_PUBLIC_SITE_URL controls the
    # canonical application URL and can be changed independently at build time.
    server_name superego.cci.drexel.edu sam.cci.drexel.edu;

    client_max_body_size 10m;

    location / {
        proxy_pass http://matsci_sam_nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve streaming responses from the Next.js App Router.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
