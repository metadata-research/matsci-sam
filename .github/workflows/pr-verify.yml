name: PR Verify

on:
  pull_request:
    branches:
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint

      - name: Check Types
        run: |
          pnpm check-types

      - name: Test Authentication
        run: |
          pnpm test:auth

      - name: Test Public Identifiers
        run: |
          pnpm test:identifiers

      - name: Test Definition Revisions
        run: |
          pnpm test:revisions

      - name: Test Interface State
        run: |
          pnpm test:interface

      - name: Test Ollama Revision Context
        run: |
          pnpm test:ollama-context

      - name: Check Migrations
        run: |
          pnpm db:check

      - name: Build
        env:
          SYSTEM_PROMPT_KEY: materials-reference
          REFINE_PROMPT_KEY: refine
        run: |
          pnpm build
