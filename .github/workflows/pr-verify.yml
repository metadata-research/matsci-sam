name: PR Verify

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint

      - name: Check Types
        run: |
          pnpm check-types

      - name: Test Authentication
        run: |
          pnpm test:auth

      - name: Test Public Identifiers
        run: |
          pnpm test:identifiers

      - name: Test Interface State
        run: |
          pnpm test:interface

      - name: Test Ollama Revision Context
        run: |
          pnpm test:ollama-context

      - name: Test Deployment Contract
        run: |
          pnpm test:deployment
          bash -n \
            deploy/bootstrap-server.sh \
            deploy/check-runtime-parity.sh \
            deploy/deploy-superego-from-workstation.sh \
            deploy/lib/deploy-superego-in-place-remote.sh \
            deploy/provision-ego-runtime.sh \
            deploy/seed-ego-from-superego.sh \
            deploy/deploy-ego-from-workstation.sh \
            deploy/cutover-ego-public.sh \
            deploy/lib/provision-ego-runtime-remote.sh \
            deploy/lib/export-superego-for-ego-seed-remote.sh \
            deploy/lib/seed-ego-from-superego-remote.sh \
            deploy/lib/deploy-ego-precutover-remote.sh \
            deploy/lib/cutover-ego-public-remote.sh \
            deploy/ops/matsci-sam-ops \
            .agents/skills/manage-matsci-environments/scripts/status.sh

      - name: Check Migrations
        run: |
          pnpm db:check

      - name: Build
        env:
          SYSTEM_PROMPT_KEY: materials-reference
          REFINE_PROMPT_KEY: refine
        run: |
          pnpm build
