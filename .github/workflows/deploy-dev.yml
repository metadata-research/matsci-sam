name: Deploy to Superego Development

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: superego-development
  cancel-in-progress: false

jobs:
  deploy:
    # This runner is registered with --no-default-labels, so the production
    # workflow's generic `self-hosted` selector cannot send jobs to it.
    runs-on: superego-dev
    environment:
      name: superego-dev
      url: https://ego.cci.drexel.edu
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build and activate release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: ${RELEASE_SHA}" >&2
            exit 1
          fi

          app_root=/opt/matsci-sam
          release="${app_root}/releases/${RELEASE_SHA}"
          previous=$(readlink -f "${app_root}/current" 2>/dev/null || true)

          if [[ -n "${previous}" && "${previous}" != "${app_root}/releases/"* ]]; then
            echo "Refusing unexpected current target: ${previous}" >&2
            exit 1
          fi

          umask 0007
          if [[ -e "${release}" ]]; then
            find "${release}" -mindepth 1 -delete
          else
            install -d -m 2770 "${release}"
          fi

          git archive --format=tar HEAD | tar --extract --directory "${release}"
          chmod -R g+rwX "${release}"

          sudo -u matsci-sam -- /bin/bash -s -- "${release}" <<'BUILD_RELEASE'
          set -Eeuo pipefail
          umask 0007
          release=$1

          set -a
          source /etc/matsci-sam/app.env
          set +a

          cd "${release}"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm db:migrate
          BUILD_RELEASE

          next_link="${app_root}/.current-${RELEASE_SHA}"
          ln -sfn "${release}" "${next_link}"
          mv -Tf "${next_link}" "${app_root}/current"
          sudo /usr/bin/systemctl restart matsci-sam.service

          healthy=false
          for attempt in {1..20}; do
            if curl --fail --silent \
              --output /dev/null http://127.0.0.1:3000/; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "${healthy}" != true ]]; then
            echo "Health check failed; restoring the previous release." >&2
            if [[ -n "${previous}" ]]; then
              rollback_link="${app_root}/.rollback-${RELEASE_SHA}"
              ln -sfn "${previous}" "${rollback_link}"
              mv -Tf "${rollback_link}" "${app_root}/current"
              sudo /usr/bin/systemctl restart matsci-sam.service
            fi
            exit 1
          fi

          echo "Deployed ${RELEASE_SHA} to ${release}"
